name: CI

on:
  push:
    branches:
      - main
      - global-modernization
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore core tests and audit packages
        run: dotnet restore tests/MultiBloxy.Core.Tests/MultiBloxy.Core.Tests.csproj

      - name: Run core tests
        run: >-
          dotnet test tests/MultiBloxy.Core.Tests/MultiBloxy.Core.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  windows-build:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit packages
        run: dotnet restore MultiBloxy.sln

      - name: Verify formatting
        run: dotnet format MultiBloxy.sln --verify-no-changes --no-restore --severity warn

      - name: Build solution
        run: dotnet build MultiBloxy.sln --configuration Release --no-restore

      - name: Run core tests
        run: >-
          dotnet test tests/MultiBloxy.Core.Tests/MultiBloxy.Core.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=core-tests-windows.trx"
          --results-directory TestResults

      - name: Run Windows integration tests
        run: >-
          dotnet test tests/MultiBloxy.Windows.Tests/MultiBloxy.Windows.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=windows-tests.trx"
          --results-directory TestResults

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
